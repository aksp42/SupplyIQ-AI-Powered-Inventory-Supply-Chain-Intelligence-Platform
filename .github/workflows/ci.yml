name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ================================================================
  # SECRET SCAN
  # ================================================================
  secret-scan:
    name: No committed secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check environment files
        shell: bash
        run: |
          set -euo pipefail

          tracked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|secret)$' || true)

          if [ -n "$tracked" ]; then
            echo "::error::Environment file is tracked:"
            echo "$tracked"
            exit 1
          fi

          test -f backend/.env.example || {
            echo "::error::backend/.env.example is missing"
            exit 1
          }

          echo "OK: environment files are clean"

      - name: Check credential-shaped values
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/secret-patterns.txt" <<'PATTERNS'
          BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY
          AIza[0-9A-Za-z_-]{35}
          AKIA[0-9A-Z]{16}
          ASIA[0-9A-Z]{16}
          ghp_[0-9A-Za-z]{36}
          github_pat_[0-9A-Za-z_]{20,}
          glpat-[0-9A-Za-z_-]{20,}
          npm_[0-9A-Za-z]{36}
          xox[baprs]-[0-9A-Za-z-]{10,}
          sk_live_[0-9A-Za-z]{20,}
          rk_live_[0-9A-Za-z]{20,}
          ya29\.[0-9A-Za-z_-]{20,}
          PATTERNS

          cat > "$RUNNER_TEMP/secret-assignments.txt" <<'PATTERNS'
          (DB_PASSWORD|MYSQL_PASSWORD|JWT_SECRET|EMAIL_APP_PASSWORD|SERVICE_ACCOUNT_KEY|[A-Z_]*_SECRET|[A-Z_]*_TOKEN|[A-Z_]*_API_KEY|[A-Z_]*APP_PASSWORD)[[:space:]]*[:=][[:space:]]*["'][^"']{6,}["']
          PATTERNS

          failed=0

          files=$(git ls-files -z \
            | grep -zvE '(^|/)\.env$|^\.github/workflows/|^(README\.md|docs/)|firebase-config\.js$' || true)

          for pattern_file in secret-patterns secret-assignments; do
            matches=$(
              printf '%s\0' "$files" |
              xargs -0 -r grep -nEI -f "$RUNNER_TEMP/$pattern_file.txt" 2>/dev/null || true
            )

            if [ -n "$matches" ]; then
              echo "::error::Credential-shaped value found:"
              echo "$matches"
              failed=1
            fi
          done

          exit "$failed"

      - name: Check secret fallbacks
        shell: bash
        run: |
          set -euo pipefail

          matches=$(
            git ls-files -z 'backend/*.js' |
            xargs -0 -r grep -nE \
            "process\.env\.(DB_PASSWORD|DEMO_PASSWORD|JWT_SECRET|[A-Z_]*APP_PASSWORD|[A-Z_]*SECRET|[A-Z_]*TOKEN|[A-Z_]*API_KEY)\s*\|\|\s*'[^']+'" \
            || true
          )

          if [ -n "$matches" ]; then
            echo "::error::Secret-shaped environment fallback found:"
            echo "$matches"
            exit 1
          fi

          echo "OK: no secret fallbacks"

      - name: Check service account keys
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -qE 'serviceAccountKey|\.pem$'; then
            echo "::error::Firebase service account key or PEM file is tracked"
            exit 1
          fi

          echo "OK: no service account keys"

      - name: Check schema for plaintext passwords
        shell: bash
        run: |
          set -euo pipefail

          matches=$(
            git ls-files -z -- backend/supplyiq_schema.sql |
            xargs -0 -r grep -nEi "password.*['\"][^'\"]{6,}['\"]" 2>/dev/null |
            grep -v '\$2' ||
            true
          )

          if [ -n "$matches" ]; then
            echo "::error::Plaintext password found in schema"
            echo "$matches"
            exit 1
          fi

          echo "OK: schema password check passed"

  # ================================================================
  # BACKEND TESTS
  # ================================================================
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: secret-scan

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_pw
          MYSQL_DATABASE: supplyiq
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      NODE_ENV: test
      PORT: 4000

      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci_test_pw
      DB_NAME: supplyiq

      JWT_SECRET: ci-only-value-not-a-real-secret-0123456789abcdef
      JWT_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 10

      FIREBASE_API_KEY: ci-placeholder-key

      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      DEMO_EMAIL: demo@supplyiq.local
      DEMO_STORE_ID: demo-store-01

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run migrations
        working-directory: backend
        run: node scripts/migrate.js up

      - name: Seed database
        working-directory: backend
        run: |
          node seed-mysql.js
          node scripts/seed-sample.js

      - name: Start backend
        working-directory: backend
        run: |
          node server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

      - name: Wait for backend
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4000/api/health > /dev/null; then
              echo "Backend ready"
              exit 0
            fi

            sleep 1
          done

          echo "::error::Backend did not become ready"
          cat /tmp/server.log
          exit 1

      - name: Test authentication
        shell: bash
        run: |
          set -euo pipefail

          code=$(
            curl -s \
              -o /dev/null \
              -w '%{http_code}' \
              "http://127.0.0.1:4000/api/kpis?storeId=${DEMO_STORE_ID}"
          )

          echo "Unauthenticated KPI request: $code"

          [ "$code" = "401" ]

          curl -sf \
            -X POST \
            http://127.0.0.1:4000/api/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${DEMO_EMAIL}\",\"password\":\"${DEMO_PASSWORD}\"}" \
            > /tmp/login.json

          TOKEN=$(
            node -e \
            "process.stdout.write(require('/tmp/login.json').token || '')"
          )

          [ -n "$TOKEN" ]

          curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            "http://127.0.0.1:4000/api/kpis?storeId=${DEMO_STORE_ID}" \
            > /dev/null

          echo "Authentication smoke test passed"

      - name: Run API tests
        working-directory: backend
        run: npm test

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-server-log
          path: /tmp/server.log

  # ================================================================
  # FRONTEND
  # ================================================================
  frontend-validate:
    name: Frontend validation
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required frontend files
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "frontend/SupplyIQ-Grocery-Dashboard.html"
            "frontend/SupplyShield-AI.html"
            "frontend/public/login.html"
            "frontend/public/signup.html"
            "frontend/public/landing.html"
            "frontend/public/js/auth.js"
            "frontend/firebase-config.js"
            "frontend/public/firebase-config.js"
            "frontend/css/style.css"
            "frontend/public/css/style.css"
          )

          for file in "${files[@]}"; do
            test -f "$file" || {
              echo "::error::Missing $file"
              exit 1
            }
          done

          echo "All required frontend files exist"

      - name: Check authentication wiring
        shell: bash
        run: |
          set -euo pipefail

          grep -q "Bearer" frontend/public/js/auth.js
          grep -q "getIdToken" frontend/public/js/auth.js
          grep -q "siq_signed_out" frontend/public/js/auth.js

          echo "Authentication wiring is present"

      - name: Check auth modules are synchronized
        shell: bash
        run: |
          set -euo pipefail

          test -f frontend/js/auth.js
          test -f frontend/public/js/auth.js

          diff -q \
            frontend/js/auth.js \
            frontend/public/js/auth.js

          echo "Auth modules are synchronized"

      - name: Validate nginx configuration
        shell: bash
        run: |
          set -euo pipefail

          sed 's/backend/127.0.0.1/g' frontend/nginx.conf |
            docker run --rm -i nginx:alpine \
            nginx -t -c /etc/nginx/nginx.conf

  # ================================================================
  # DOCKER BUILD
  # ================================================================
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: supplyiq-backend:${{ github.sha }}

      - name: Start MySQL
        shell: bash
        run: |
          set -euo pipefail

          docker network create supplyiq-ci

          docker run -d \
            --name supplyiq-ci-db \
            --network supplyiq-ci \
            -e MYSQL_ROOT_PASSWORD=ci_test_pw \
            -e MYSQL_DATABASE=supplyiq \
            mysql:8.0

          for i in $(seq 1 40); do
            if docker exec supplyiq-ci-db \
              mysqladmin ping --silent -pci_test_pw \
              > /dev/null 2>&1; then
              echo "MySQL ready"
              exit 0
            fi

            sleep 2
          done

          echo "::error::MySQL failed to start"
          docker logs supplyiq-ci-db
          exit 1

      - name: Start backend container
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name supplyiq-ci-backend \
            --network supplyiq-ci \
            -p 4000:4000 \
            -e PORT=4000 \
            -e NODE_ENV=production \
            -e DB_HOST=supplyiq-ci-db \
            -e DB_PORT=3306 \
            -e DB_USER=root \
            -e DB_PASSWORD=ci_test_pw \
            -e DB_NAME=supplyiq \
            -e JWT_SECRET=ci-only-value-not-a-real-secret-0123456789abcdef \
            -e JWT_EXPIRES_IN=7d \
            -e BCRYPT_ROUNDS=10 \
            -e FIREBASE_API_KEY=ci-placeholder-key \
            supplyiq-backend:${{ github.sha }}

      - name: Wait for backend container
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4000/api/health > /dev/null; then
              echo "Backend image is healthy"
              exit 0
            fi

            sleep 2
          done

          echo "::error::Backend image did not become ready"
          docker logs supplyiq-ci-backend
          exit 1

      - name: Verify authentication guard
        shell: bash
        run: |
          code=$(
            curl -s \
              -o /dev/null \
              -w '%{http_code}' \
              "http://127.0.0.1:4000/api/kpis?storeId=demo-store-01"
          )

          echo "Unauthenticated KPI request: $code"

          [ "$code" = "401" ]

      - name: Logs on failure
        if: failure()
        run: |
          docker logs supplyiq-ci-backend || true
          docker logs supplyiq-ci-db || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f supplyiq-ci-backend supplyiq-ci-db 2>/dev/null || true
          docker network rm supplyiq-ci 2>/dev/null || true

  # ================================================================
  # FULL COMPOSE INTEGRATION
  # ================================================================
  integration:
    name: End-to-end (compose)
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-validate

    env:
      NODE_ENV: production
      PORT: 4000

      DB_PASSWORD: ci_test_pw
      DB_NAME: supplyiq

      JWT_SECRET: ci-only-value-not-a-real-secret-0123456789abcdef
      JWT_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 10

      FIREBASE_API_KEY: ci-placeholder-key

      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      DEMO_EMAIL: demo@supplyiq.local
      DEMO_STORE_ID: demo-store-01

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          echo "Compose configuration is valid"

      - name: Create CI environment
        shell: bash
        run: |
          set -euo pipefail

          cat > .env <<EOF
          DB_PASSWORD=${DB_PASSWORD}
          DB_NAME=${DB_NAME}
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
          BCRYPT_ROUNDS=${BCRYPT_ROUNDS}
          NODE_ENV=${NODE_ENV}
          PORT=${PORT}
          FIREBASE_API_KEY=${FIREBASE_API_KEY}
          DEMO_EMAIL=${DEMO_EMAIL}
          DEMO_STORE_ID=${DEMO_STORE_ID}
          DEMO_PASSWORD=${DEMO_PASSWORD}
          EOF

          chmod 600 .env

      # ------------------------------------------------------------
      # IMPORTANT:
      # Do NOT start the whole compose stack here.
      #
      # The old workflow started frontend -> backend health dependency
      # before migrations. If backend health depends on DB tables, this
      # creates:
      #
      # backend unhealthy
      #      ->
      # frontend cannot start
      #      ->
      # compose up fails
      #
      # Start MySQL and backend first, migrate, then start frontend.
      # ------------------------------------------------------------
      - name: Start MySQL and backend
        run: |
          docker compose up -d --build mysql backend

      - name: Wait for MySQL
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 40); do
            if docker compose exec -T mysql \
              mysqladmin ping \
              -h 127.0.0.1 \
              -p"${DB_PASSWORD}" \
              --silent \
              > /dev/null 2>&1; then

              echo "MySQL is ready"
              exit 0
            fi

            sleep 2
          done

          echo "::error::MySQL did not become ready"
          docker compose logs mysql
          exit 1

      - name: Run database migrations
        run: |
          set -euo pipefail

          docker compose exec -T backend \
            node scripts/migrate.js up

      - name: Seed demo owner
        run: |
          set -euo pipefail

          docker compose exec -T \
            -e DEMO_PASSWORD \
            -e DEMO_EMAIL \
            -e DEMO_STORE_ID \
            backend \
            node scripts/seed-sample.js

      # Start nginx/frontend only after DB setup.
      # --no-deps intentionally bypasses a backend service_healthy
      # dependency if the compose file has one.
      - name: Start frontend
        run: |
          docker compose up -d --no-deps frontend

      - name: Wait for backend health
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:4000/api/health > /dev/null; then
              echo "Backend healthy"
              exit 0
            fi

            sleep 2
          done

          echo "::error::Backend health endpoint failed"

          docker compose ps
          docker compose logs --tail 120 backend

          exit 1

      - name: Wait for frontend
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1/ > /dev/null; then
              echo "Frontend/nginx ready"
              exit 0
            fi

            sleep 2
          done

          echo "::error::Frontend did not become ready"
          docker compose ps
          docker compose logs --tail 120 frontend
          exit 1

      - name: Check application pages
        shell: bash
        run: |
          set -euo pipefail

          check_page() {
            local path="$1"
            local code

            code=$(
              curl -s \
                -o /dev/null \
                -w '%{http_code}' \
                "http://127.0.0.1${path}"
            )

            echo "${path} -> ${code}"

            [ "$code" = "200" ] || {
              echo "::error::${path} returned ${code}"
              exit 1
            }
          }

          check_page /
          check_page /public/landing.html
          check_page /public/login.html
          check_page /public/signup.html
          check_page /SupplyIQ-Grocery-Dashboard.html
          check_page /SupplyShield-AI.html
          check_page /js/auth.js
          check_page /css/style.css

      - name: Test login through nginx
        shell: bash
        run: |
          set -euo pipefail

          curl -sf \
            -X POST \
            http://127.0.0.1/api/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${DEMO_EMAIL}\",\"password\":\"${DEMO_PASSWORD}\"}" \
            > /tmp/login.json

          TOKEN=$(
            node -e \
            "process.stdout.write(require('/tmp/login.json').token || '')"
          )

          [ -n "$TOKEN" ] || {
            echo "::error::Login returned no token"
            exit 1
          }

          code=$(
            curl -s \
              -o /dev/null \
              -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              "http://127.0.0.1/api/kpis?storeId=${DEMO_STORE_ID}"
          )

          echo "Authenticated KPI request -> ${code}"

          [ "$code" = "200" ]

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 200

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans
          rm -f .env
