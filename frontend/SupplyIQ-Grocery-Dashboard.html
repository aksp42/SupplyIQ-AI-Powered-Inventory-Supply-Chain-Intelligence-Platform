<!-- STACK: vanilla HTML/CSS/JS (CSS variables theming) + Apache ECharts (interactive charts) + Three.js (3D hero) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/api.js"></script>
<style>
/* ===== THEMES: all colours come from these variables ===== */
:root,[data-theme=green]{--side1:#0b3b34;--side2:#062a24;--sidetx:#b9d6cb;--acc:#0f8a5f;--acc2:#3ddc97;--g:#12a05f;--soft:#eaf5f0;--bd:#dfe9e4;--ink:#0f2a24;--ink2:#61776f;--amb:#e5a11a;--red:#dc4a3f;--blue:#3b82d6;--bg1:#f5f8f7;--bg2:#eaf1ee;--card:#fff;--edge:#eef3f0;--sh:8,50,40}
[data-theme=dark]{--side1:#0a1a17;--side2:#050e0c;--sidetx:#9dbdb1;--acc:#22b573;--acc2:#3ddc97;--g:#3ddc97;--soft:#173029;--bd:#25423a;--ink:#e8f4ef;--ink2:#8fb0a4;--amb:#f0b429;--red:#f0645a;--blue:#5aa9f0;--bg1:#0a1512;--bg2:#0d1e19;--card:#12251f;--edge:#1b332c;--sh:0,0,0}
[data-theme=terracotta]{--side1:#4a2318;--side2:#2e150e;--sidetx:#e6cdbd;--acc:#a24b34;--acc2:#f0b48a;--g:#5f7e52;--soft:#fbeee2;--bd:#e9dccb;--ink:#3a2a22;--ink2:#7a6659;--amb:#d08a4a;--red:#b83a2a;--blue:#6f8f9a;--bg1:#fbf7f1;--bg2:#f3eadd;--card:#fffdf9;--edge:#f2e8da;--sh:74,35,24}
[data-theme=ocean]{--side1:#0c2a4a;--side2:#071a30;--sidetx:#bcd3ea;--acc:#1f6fd1;--acc2:#7cc4ff;--g:#14a085;--soft:#e8f1fc;--bd:#d9e5f2;--ink:#10263f;--ink2:#5c7690;--amb:#e5a11a;--red:#dc4a5f;--blue:#3b82d6;--bg1:#f4f8fc;--bg2:#e6eef8;--card:#fff;--edge:#ecf2f8;--sh:12,42,74}
[data-theme=violet]{--side1:#2a1650;--side2:#180b33;--sidetx:#d3c6ee;--acc:#7a3fd1;--acc2:#c8a6ff;--g:#2fa36b;--soft:#f1eafc;--bd:#e4dbf3;--ink:#241640;--ink2:#71648f;--amb:#e5a11a;--red:#dc4570;--blue:#4f8fe0;--bg1:#f8f6fd;--bg2:#eee8f9;--card:#fff;--edge:#f0ebf8;--sh:42,22,80}
*{box-sizing:border-box;margin:0;padding:0}
html.tt *{transition:background-color .35s,color .35s,border-color .35s!important}
body{font:13.5px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;min-height:100vh;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;transition:transform .15s,box-shadow .2s,background .2s,filter .2s}
button:active{transform:scale(.97)}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* layout - Full Width Modern Workspace */
aside{display:none}
main{margin:0 auto;padding:14px 24px 105px;position:relative;z-index:1;max-width:1600px;box-sizing:border-box}

/* Floating Bottom Center Navigation Dock */
.dock-nav-wrap{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;align-items:center;justify-content:center;pointer-events:none}
.dock-nav{pointer-events:auto;display:flex;align-items:center;gap:4px;padding:6px 10px;background:color-mix(in srgb,var(--side1) 88%,transparent);backdrop-filter:blur(20px) saturate(190%);-webkit-backdrop-filter:blur(20px) saturate(190%);border:1px solid rgba(255,255,255,.16);border-radius:40px;box-shadow:0 20px 48px -12px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.2);transition:all .28s cubic-bezier(.16,1,.3,1)}
.dock-nav:hover{box-shadow:0 24px 58px -10px rgba(0,0,0,.52),0 0 0 1px rgba(255,255,255,.18);transform:translateY(-2px)}
.dock-nav a{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:26px;color:var(--sidetx);text-decoration:none;font-weight:600;font-size:12.5px;letter-spacing:-.01em;position:relative;transition:all .2s cubic-bezier(.16,1,.3,1);white-space:nowrap}
.dock-nav a .nav-ic{width:22px;height:22px;display:grid;place-items:center;transition:transform .2s ease}
.dock-nav a .nav-ic svg{width:16.5px;height:16.5px;stroke-width:2}
.dock-nav a:hover{color:#fff;background:rgba(255,255,255,.12);transform:translateY(-1.5px)}
.dock-nav a:hover .nav-ic{transform:scale(1.14)}
.dock-nav a.on{background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--side2);font-weight:700;box-shadow:0 4px 18px -2px rgba(61,220,151,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.dock-nav a.on .nav-ic{color:var(--side2)}
.dock-nav a.on .nav-ic svg{stroke-width:2.2}
@media(max-width:980px){
  .dock-nav{max-width:96vw;overflow-x:auto;padding:5px 8px;gap:2px}
  .dock-nav a{padding:6px 9px;font-size:11px}
  .dock-nav a span:not(.nav-ic){display:none}
}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
header h2{font-size:15px;font-weight:700}header p{color:var(--ink2);font-size:12px}
.sp{margin-left:auto}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:2px}
.seg button{padding:5px 12px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--ink2)}
.seg button.on{background:var(--acc);color:#fff;box-shadow:0 2px 8px rgba(var(--sh),.3)}
.ib{width:34px;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--bd);display:grid;place-items:center;position:relative;font-size:16px;color:var(--ink)}
.ib:hover{background:var(--soft)}
.ib em{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-style:normal;border-radius:9px;padding:0 5px}
.pf{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:2px 10px 2px 2px;text-align:left;font-size:12.5px;line-height:1.2}
.av{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.pop{position:absolute;right:0;top:40px;width:250px;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 18px 40px rgba(var(--sh),.28);padding:5px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:.18s;z-index:40}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.pop div,.pop button{padding:7px 9px;border-radius:7px;font-size:12.5px;display:flex;gap:8px;align-items:center;width:100%;text-align:left}.pop div:hover,.pop button:hover{background:var(--soft)}
.pop .sw{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 0 1px var(--bd);background:linear-gradient(135deg,var(--x),var(--y))}
.pop button.cur{background:var(--soft);font-weight:700}
.rel{position:relative}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;margin-bottom:12px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.kp{grid-template-columns:repeat(5,1fr)}.kp>*{grid-column:auto}
/* Demand forecast owns a full row so its chart and table can breathe. */
#forecast #fch{height:300px;margin-top:2px}
#forecast .ai{margin-bottom:10px}
/* Inventory and supplier sit side by side in their own row, so they no longer
   stretch to the height of the old forecast card. */
.compact-card{justify-content:flex-start}
.inv-top{display:flex;gap:12px;align-items:center;flex:1}
.inv-donut{width:112px;height:112px;flex:none}
.inv-value{display:flex;align-items:center;margin-top:6px;padding-top:6px;border-top:1px solid var(--edge)}
#sup .sup-top{display:flex;gap:12px;align-items:center;margin-bottom:6px}
#sup .sup-donut{width:92px;height:92px;flex:none}
#sup .sup-list{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
#sup .sup-list .rw{padding:5px 2px;min-width:0}
#sup .sup-list .rw span{width:84px}
#sup .sup-more{grid-column:1/-1;justify-content:center;color:var(--ink2);font-size:11.5px}
#stockout.short-card{padding-bottom:13px}
/* cards (subtle depth) */
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 14px;box-shadow:0 1px 2px rgba(var(--sh),.06),0 14px 30px -20px rgba(var(--sh),.45);transition:transform .25s ease,box-shadow .25s;min-width:0;display:flex;flex-direction:column;will-change:transform}
.card:hover{box-shadow:0 2px 4px rgba(var(--sh),.08),0 22px 40px -18px rgba(var(--sh),.5)}
.h{display:flex;align-items:center;gap:8px;margin-bottom:9px}.h h3{font-size:13.5px;font-weight:700;letter-spacing:-.005em}.h .ic{width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-size:14px}
.h a{margin-left:auto;font-size:12px;color:var(--acc);cursor:pointer;font-weight:600}.h a:hover{text-decoration:underline}
.mut{color:var(--ink2);font-size:12px}
/* hero + 3D */
.hero{position:relative;overflow:hidden;padding:0;min-height:158px;background:linear-gradient(115deg,var(--side1) 30%,var(--side2));color:#fff;border:0;flex-direction:row;align-items:stretch}
.hero .tx{position:relative;z-index:2;padding:18px 22px;max-width:58%;display:flex;flex-direction:column;gap:6px}
.hero h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}.hero p{color:var(--sidetx);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.chips span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);padding:4px 10px;border-radius:7px;font-size:12px;backdrop-filter:blur(6px)}.chips b{color:var(--acc2)}
.hero .btn.ol{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)}
#h3d{position:absolute;inset:0 0 0 38%;z-index:1}#h3d canvas{width:100%!important;height:100%!important;display:block}
/* KPI */
.kpi{gap:2px;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(var(--sh),.16)}
#chartc, #inv, #sup, #forecast, #best, #risks{cursor:pointer;transition:box-shadow .2s ease}
#chartc:hover, #inv:hover, #sup:hover, #forecast:hover, #best:hover, #risks:hover{box-shadow:0 6px 20px rgba(var(--sh),.14)}
.inv-donut, .sup-donut, #cvs, #fch{cursor:pointer}
.kt{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12px;font-weight:600}.kt .ic{width:26px;height:26px;border-radius:7px;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-size:14px}
.kpi b{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:3px}
.kf{display:flex;align-items:center;justify-content:space-between;gap:6px}.kf small{font-size:11.5px;font-weight:600;display:flex;gap:3px;align-items:center}
.up{color:var(--g)}.dn{color:var(--red)}
.fade{animation:fd .4s}@keyframes fd{from{opacity:.3;transform:translateY(5px)}}
.sk path{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
/* attention */
.att{--c:var(--acc);border:1px solid var(--bd);border-top:3px solid var(--c);border-radius:10px;padding:10px 12px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 6%,var(--card)),var(--card));display:flex;flex-direction:column;gap:3px;transition:transform .2s,box-shadow .2s}
.att:hover{transform:translateY(-3px);box-shadow:0 14px 26px -14px rgba(var(--sh),.5)}
.att.r{--c:var(--red)}.att.a{--c:var(--amb)}.att.b{--c:var(--blue)}.att.o{--c:#e2762a}
.lb{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--c)}
.att h4{font-size:14.5px;font-weight:700}.att p{font-size:12px;color:var(--ink2)}
.btn{padding:6px 12px;border-radius:8px;font-weight:600;font-size:12.5px;color:#fff;background:var(--acc);display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{filter:brightness(1.1);box-shadow:0 6px 14px -4px rgba(var(--sh),.5)}
.btn.ol{background:var(--card);color:var(--ink);border:1px solid var(--bd)}.btn.ol:hover{background:var(--soft)}
.btn.tn{background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);margin-top:auto}.btn.tn:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.w{width:100%}
/* images: shimmer while loading + 3D tile */
.pim{border-radius:9px;object-fit:cover;background:linear-gradient(110deg,var(--soft) 30%,var(--edge) 50%,var(--soft) 70%) 0 0/200% 100%;animation:shim 1.3s linear infinite;flex:none;box-shadow:0 1px 2px rgba(var(--sh),.2),0 6px 12px -6px rgba(var(--sh),.5);transition:transform .3s;border:1px solid var(--bd)}
.pim.ok{animation:none;background:var(--soft)}
@keyframes shim{to{background-position:-200% 0}}
.pim.big{border-radius:12px;box-shadow:0 12px 26px -14px rgba(var(--sh),.55)}
tr:hover .pim,.att:hover .pim{transform:perspective(200px) rotateY(-14deg) scale(1.12)}
.att .pr-c{gap:13px}.att .pim{border-radius:12px}.att:hover .pim{transform:perspective(300px) rotateY(-10deg) scale(1.05)}
/* product showcase gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;margin-top:6px}
.pc{border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--card);cursor:pointer;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s,border-color .25s}
.pc:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--acc) 45%,var(--bd));box-shadow:0 22px 36px -18px rgba(var(--sh),.55)}
.pc .ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--soft)}
.pc .ph .pim{width:100%;height:100%;border:0;border-radius:0;box-shadow:none;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.pc:hover .ph .pim{transform:scale(1.09)}
.pc .tag{position:absolute;top:9px;left:9px}
.pc .tag .pill{background:color-mix(in srgb,var(--c) 14%,var(--card));box-shadow:0 2px 8px rgba(0,0,0,.18)}
.pc .prt{position:absolute;right:9px;bottom:9px;background:rgba(10,20,17,.72);color:#fff;font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;backdrop-filter:blur(6px)}
.pc .bd{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc h4{font-size:14.5px;font-weight:700}
.mrow{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--ink2)}.mrow b{color:var(--ink)}
.pr-c{display:flex;gap:9px;align-items:center;font-weight:600}
/* lists / tables */
.drop{flex:1;display:grid;place-content:center;gap:2px;border:1.5px dashed var(--bd);border-radius:10px;padding:8px;text-align:center;color:var(--ink2);transition:.2s;font-size:12.5px;margin-bottom:8px;background:var(--soft)}
.drop.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
/* Import feedback: which format was detected, and why a file was refused. Both
   are permanent rows rather than toasts — a toast disappears before it has been
   read, and a mis-detected or refused file must stay visible next to the picker
   that produced it. */
.imp-note{margin:-2px 0 8px;padding:6px 9px;border-radius:7px;font-size:11.5px;
  background:color-mix(in srgb,var(--acc) 9%,var(--card));
  border:1px solid color-mix(in srgb,var(--acc) 26%,var(--card));color:var(--ink2)}
.imp-note b{color:var(--ink);font-weight:700}
.ie{padding:9px 11px;border-radius:9px;margin:-2px 0 8px;
  background:color-mix(in srgb,var(--red) 7%,var(--card));
  border:1px solid color-mix(in srgb,var(--red) 30%,var(--card))}
.ie-t{font-weight:700;font-size:12.5px;color:var(--red);margin-bottom:3px}
.ie-m{font-size:12px;color:var(--ink2);line-height:1.5}
.ie-a{display:flex;gap:6px;margin-top:8px}
.btn.sm{padding:4px 10px;font-size:11.5px}
.btn.oc{background:var(--card);color:var(--ink);border:1px solid var(--bd)}
.hide{display:none!important}
.rw{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--edge);font-size:12.5px;border-radius:6px}.rw:last-child{border:0}.rw b{margin-left:auto}
.rw.hv:hover,tr.pr:hover,tr.fr:hover{background:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;color:var(--ink2);font-weight:600;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 4px}td{padding:5px 4px;border-top:1px solid var(--edge)}
tr.pr,tr.fr{cursor:pointer}tr.fr.sel{background:var(--soft)}
.pill{display:inline-flex;gap:5px;align-items:center;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap;--c:var(--g);background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
.pill:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c)}
.p-g{--c:var(--g)}.p-a{--c:var(--amb)}.p-r{--c:var(--red)}.p-b{--c:var(--blue)}
.ai{font-size:11.5px;color:var(--ink2);border-left:3px solid var(--acc);background:var(--soft);border-radius:0 8px 8px 0;padding:6px 10px;margin-bottom:8px}
.fc{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}.fc button{font-size:11.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--ink2);font-weight:600}.fc button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lg{display:flex;flex-direction:column;justify-content:center;flex:1;gap:1px}.lg div{display:flex;gap:7px;align-items:center;font-size:12.5px;padding:3px 6px;border-radius:6px;cursor:pointer}.lg div:hover{background:var(--soft)}.lg i{width:9px;height:9px;border-radius:3px}.lg b{margin-left:auto}
.bar{height:5px;border-radius:9px;background:var(--edge);overflow:hidden;flex:1}.bar i{display:block;height:100%;border-radius:9px;background:var(--g);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.al{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;margin-bottom:6px;--c:var(--acc);transition:.2s}.al:hover{transform:translateX(3px);border-color:var(--c);background:color-mix(in srgb,var(--c) 5%,var(--card))}
.al i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent);flex:none}.al div{flex:1;min-width:0}.al b{display:block;font-size:12.5px}.al span{font-size:11.5px;color:var(--ink2)}
.al.r{--c:var(--red)}.al.a{--c:var(--amb)}.al.b{--c:var(--blue)}.al.o{--c:#e2762a}
/* workflow */
.wfh{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:700;font-size:14px}.wfh .chip{width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-size:15px}.wfh .sp{font-size:11.5px;font-weight:500;color:var(--ink2);background:var(--soft);border:1px solid var(--bd);padding:3px 12px;border-radius:99px}
.flow{display:flex;align-items:flex-start;padding:2px 6px}
.st{flex:0 0 150px;text-align:center;cursor:pointer}

/* Add Stock stacks one field per row: label, then its input, then space. Each
   field is a block so two labels can never share a line. The gap under a label

<script>
/* =====================  AUTH GUARD & SESSION (now using siqApi)  ===================== */
// The siqApi module handles session, token validation, 401/403, and storeId injection.
const siqApi = window.siqApi;
const { api, auth, store, kpis, sales, inventory, products, stock, orders, imports, chat, forecast, getStoreId, getSession, clearSessionAndRedirect } = siqApi;

let DB_ONLINE = false;
let STORE_PROFILE = null;
let STORE_ID = null;

/* Initialize session and storeId from siqApi */
(async function initSession() {
  const sess = siqApi.getSession();
  if (!sess) { window.location.replace('public/login.html'); return; }
  // siqApi already validates token expiry on each request (401 handling)
  STORE_ID = siqApi.getStoreId();
  if (!STORE_ID) { window.location.replace('public/login.html'); return; }
})();

/* =====================  HELPERS  ===================== */
const P={bell:'M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0',home:'M3 11l9-8 9 8v10H3z',box:'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',trend:'M3 17l6-6 4 4 8-8M15 7h6v6',users:'M16 20v-2a4 4 0 0 0-8 0v2M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8',list:'M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',refresh:'M21 12a9 9 0 0 1-15 6.7L3 16M3 12a9 9 0 0 1 15-6.7L21 8M3 21v-5h5M21 3v5h-5',file:'M14 3H6v18h12V7zM14 3v4h4',gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M19 12l2-1-2-4-2 1-2-1-1-2H9L8 7 6 8 4 7l-2 4 2 1v2l-2 1 2 4 2-1 2 1 1 2h4l1-2 2-1 2 1 2-4-2-1z',help:'M12 17h.01M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7',rupee:'M7 5h10M7 9h10M7 5c6 0 6 8 0 8l7 7',bag:'M6 7h12l1 14H5zM9 7a3 3 0 0 1 6 0',warn:'M12 3l10 18H2zM12 10v4M12 17h.01',truck:'M2 6h12v10H2zM14 9h4l3 3v4h-7M6 19a2 2 0 1 0 0-.1M17 19a2 2 0 1 0 0-.1',up:'M12 19V5M5 12l7-7 7 7',plus:'M12 5v14M5 12h14',upl:'M12 16V4M6 10l6-6 6 6M4 20h16',arrow:'M5 12h14M13 6l6 6-6 6',chat:'M21 12a8 8 0 0 1-12 7l-6 2 2-5a8 8 0 1 1 16-4',x:'M6 6l12 12M18 6L6 18',brain:'M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 3 5 3 3 0 0 0 5 1V4a3 3 0 0 0-3 0M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-3 5 3 3 0 0 1-5 1',palette:'M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.5-2.2-.5-1.3.3-2.3 1.6-2.3H17a4 4 0 0 0 4-4c0-5-4-8.5-9-8.5M7.5 11h.01M9 7.5h.01M14 7h.01',moon:'M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z',sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5',clip:'M9 4h6v3H9zM7 5H5v16h14V5h-2M9 14l2 2 4-4',gauge:'M4 17a8 8 0 1 1 16 0M12 17l4-5',layers:'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5M3 18l9 5 9-5',shieldc:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5',chev:'M9 6l6 6-6 6',down:'M12 5v14M19 12l-7 7-7-7'};

const fmtCur=n=>{const v=Number(n);return Number.isFinite(v)?_cF.format(v):''};

const $=s=>document.querySelector(s),R=n=>fmtCur(n),sum=a=>a.reduce((x,y)=>x+y,0);

function getChartSideInfo(id) {
  const cVar = (v, fb) => (typeof CV === 'function' ? CV(v) : fb);
  if (id === 'rg') {
    const sups = STORE_PROFILE?.suppliers || [];
    const rates = sups.map(() => 90);
    const cols = [cVar('--g', '#22b573'), cVar('--amb', '#f59e0b'), cVar('--red', '#ef4444')];
    const okCount = sups.length ? sups.filter((s, i) => (rates[i] || 90) >= 90).length : 0;
    const warnCount = sups.length ? sups.filter((s, i) => (rates[i] || 90) >= 80 && (rates[i] || 90) < 90).length : 0;
    const badCount = sups.length ? sups.filter((s, i) => (rates[i] || 90) < 80).length : 0;
    const c = { 'Healthy': okCount, 'Need attention': warnCount, 'At risk': badCount };
    const total = sups.length;
    const avg = total ? (rates.reduce((a, b) => a + b, 0) / total).toFixed(1) : '0';
    return `
      <div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px">

            <b style="font-size:13.5px;color:var(--ink)">${c.Healthy}</b>
          </div>
          <div data-i="1" style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--soft);border-radius:8px;cursor:pointer">
            <div style="display:flex;align-items:center;gap:8px"><i style="width:11px;height:11px;border-radius:3px;background:${cols[1]};display:inline-block"></i><span style="font-size:12.5px;font-weight:600">Need attention</span></div>
            <b style="font-size:13.5px;color:var(--ink)">${c['Need attention']}</b>
          </div>

            <b style="font-size:13.5px;color:var(--ink)">${c['At risk']}</b>
          </div>
        </div>
      </div>
      <div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px">
        <span class="mut" style="font-size:11.5px">Performance Metric</span>
        <div style="font-size:22px;font-weight:800;color:var(--ink);margin:4px 0 2px">${total ? avg + '%' : '0%'}</div>
        <small class="mut">Average on-time delivery across ${total} suppliers</small>
      </div>
      <div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;font-size:12px;color:var(--ink2);line-height:1.5">

      <div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px">

    const cols = [cVar('--g', '#22b573'), cVar('--amb', '#f59e0b'), cVar('--red', '#ef4444'), cVar('--blue', '#3b82f6'), cVar('--ink2', '#64748b')];

    return `
      <div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px">
        <h4 style="margin:0 0 10px;font-size:13.5px;color:var(--ink)">Inventory Status Legend</h4>
        <div style="display:flex;flex-direction:column;gap:7px">
          ${keys.map((k, i) => `
            <div data-i="${i}" style="display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--soft);border-radius:8px;cursor:pointer">
              <div style="display:flex;align-items:center;gap:8px"><i style="width:11px;height:11px;border-radius:3px;background:${cols[i]};display:inline-block"></i><span style="font-size:12.5px;font-weight:600">${k}</span></div>
              <b style="font-size:13.5px;color:var(--ink)">${c[k]}</b>
            </div>
          `).join('')}
        </div>
      </div>
      <div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px">
        <span class="mut" style="font-size:11.5px">Total Inventory Value</span>
        <div style="font-size:22px;font-weight:800;color:var(--ink);margin:4px 0 2px">${R(invVal())}</div>
        <small class="mut">${invTotal()} total products recorded</small>
      </div>
      <div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;font-size:12px;color:var(--ink2);line-height:1.5">
        <b style="color:var(--ink);display:block;margin-bottom:6px">Status Breakdown & Descriptions</b>
        <p style="margin:0 0 6px"><span style="color:${cols[0]};font-weight:700">● Healthy:</span> Stock cover is within the ideal range.</p>
        <p style="margin:0 0 6px"><span style="color:${cols[1]};font-weight:700">● Low Stock:</span> Below safety level — reorder recommended.</p>
        <p style="margin:0"><span style="color:${cols[2]};font-weight:700">● Critical:</span> Near stockout — order immediately.</p>
      </div>
    `;
  } else if (id === 'cvs') {
    const d = D[S.per];
    const sales = sum(d.s), pf = sum(d.p);
    const mg = sales > 0 ? (pf / sales * 100).toFixed(1) : '0.0';
    return `
      <div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px">
        <h4 style="margin:0 0 10px;font-size:13.5px;color:var(--ink)">Sales & Profit Summary</h4>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;padding:8px 10px;background:var(--soft);border-radius:8px">
            <span class="mut" style="font-size:12.5px">Total Revenue</span>
            <b style="font-size:14px;color:var(--ink)">${R(sales)}</b>
          </div>
          <div style="display:flex;justify-content:space-between;padding:8px 10px;background:var(--soft);border-radius:8px">
            <span class="mut" style="font-size:12.5px">Gross Profit</span>
            <b style="font-size:14px;color:var(--ink)">${R(pf)}</b>
          </div>
          <div style="display:flex;justify-content:space-between;padding:8px 10px;background:var(--soft);border-radius:8px">
            <span class="mut" style="font-size:12.5px">Profit Margin</span>
            <b style="font-size:14px;color:var(--g)">${mg}%</b>
          </div>
        </div>
      </div>
      <div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;font-size:12px;color:var(--ink2);line-height:1.5">
        <b style="color:var(--ink);display:block;margin-bottom:6px">Chart Legend & Guide</b>
        <p style="margin:0 0 6px"><span style="color:var(--acc);font-weight:700">■ Sales:</span> Total sales volume across time intervals.</p>
        <p style="margin:0 0 6px"><span style="color:var(--amb);font-weight:700">■ Profit:</span> Operating margin retained per interval.</p>
        <p style="margin:0"><span style="color:var(--g);font-weight:700">● Margin %:</span> Profit percentage over sales (right axis).</p>
      </div>
    `;
  } else if (id === 'fch') {
    const p = S.prod[S.sel] || {};
    const exp = p.ok ? `${p.fd[0]}–${p.fd[1]} units/day` : 'Baseline estimate';
    const basis = p.ok ? (p.basis === 'history' ? `${p.obs || 0} trading days recorded` : p.basis === 'ml_pipeline' ? `${p.obs || 0} days trained` : 'Monthly demand average') : 'Awaiting trading ledger';
    const isLow = p.ok && p.st < (p.fd[1] * 2);
    const orderQty = Math.max(50, (p.fd ? p.fd[1] : 10) * 10 - (p.st || 0));

    return `
      <div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px">
        <h4 style="margin:0 0 10px;font-size:13.5px;color:var(--ink)">Product Demand Forecast</h4>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px 10px;background:var(--soft);border-radius:8px">
          ${pimg(S.sel, 40)}
          <div>
            <b style="font-size:13.5px;color:var(--ink);display:block">${S.sel}</b>
            <small class="mut">SKU: ${p.sku || 'N/A'} · Stock: <b>${p.st || 0} units</b></small>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;padding:7px 10px;background:var(--soft);border-radius:8px">
            <span class="mut" style="font-size:12px">Expected Demand</span>
            <b style="font-size:13px;color:var(--ink)">${exp}</b>
          </div>
          <div style="display:flex;justify-content:space-between;padding:7px 10px;background:var(--soft);border-radius:8px">
            <span class="mut" style="font-size:12px">Forecast Basis</span>
            <b style="font-size:12.5px;color:var(--ink)">${basis}</b>
          </div>
          <div style="display:flex;justify-content:space-between;padding:7px 10px;background:var(--soft);border-radius:8px">
            <span class="mut" style="font-size:12px">Stock Status</span>
            <span class="pill ${isLow ? 'p-a' : 'p-g'}" style="font-size:11px">${isLow ? 'Reorder Needed' : 'Sufficient Stock'}</span>
          </div>
        </div>
      </div>
      <div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px">
        <span class="mut" style="font-size:11.5px">AI Supply Recommendation</span>
        <div style="font-size:18px;font-weight:800;color:var(--ink);margin:4px 0 2px">
          ${isLow ? `Order ${orderQty} units` : 'No action required'}
        </div>
        <small class="mut">${isLow ? 'Stock below 2x peak daily demand safety threshold' : 'Current stock securely covers 14+ days of projected demand'}</small>
      </div>
      <div style="background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;font-size:12px;color:var(--ink2);line-height:1.5">
        <b style="color:var(--ink);display:block;margin-bottom:6px">Chart Legend & Explanation</b>
        <p style="margin:0 0 6px"><span style="color:var(--acc);font-weight:700">● Units Sold:</span> Real past sales recorded in movement ledger.</p>
        <p style="margin:0 0 6px"><span style="color:var(--amb);font-weight:700">-- Expected Demand:</span> Machine learning 7-day projected run rate.</p>
        <p style="margin:0"><span style="color:var(--amb);font-weight:700">░ Confidence Band:</span> 80% statistical probability range based on variance.</p>
      </div>
    `;
  }
  return '';
}

function downloadReportCard(mChart, id, title) {
  const chartImg = new Image();
  chartImg.onload = () => {
    const W = 1200, H = 760;
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    // 1. Background & Outer Card
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 2;
    ctx.strokeRect(16, 16, W - 32, H - 32);

    // 2. Top Header Bar
    ctx.fillStyle = '#10b981';
    ctx.beginPath();
    ctx.roundRect(40, 34, 115, 24, 6);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText('⚡ SupplyIQ Report', 48, 50);

    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(`${title} — Executive Report Card`, 40, 88);

    const sess = getSession();
    const store = sess?.storeName || 'SupplyIQ Store';
    const now = new Date().toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    ctx.fillStyle = '#64748b';
    ctx.font = '13px sans-serif';
    ctx.fillText(`Store: ${store}   ·   Generated on: ${now}`, 40, 110);

    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(40, 126);
    ctx.lineTo(W - 40, 126);
    ctx.stroke();

    // 3. Draw Chart on the Left (520 x 480)
    ctx.drawImage(chartImg, 40, 140, 520, 480);

    // 4. Draw Rich Info & Legend Panel on the Right
    const rx = 580, rw = 580;

    if (id === 'rg') {
      const sups = STORE_PROFILE?.suppliers || [];
      const rates = sups.map(() => 90);
      const okCount = sups.length ? sups.filter((s, i) => (rates[i] || 90) >= 90).length : 0;
      const warnCount = sups.length ? sups.filter((s, i) => (rates[i] || 90) >= 80 && (rates[i] || 90) < 90).length : 0;
      const badCount = sups.length ? sups.filter((s, i) => (rates[i] || 90) < 80).length : 0;
      const total = sups.length;
      const avg = total ? (rates.reduce((a, b) => a + b, 0) / total).toFixed(1) : '0';

      // Box 1: Status Legend
      ctx.fillStyle = '#f8fafc';
      ctx.strokeStyle = '#e2e8f0';
      ctx.beginPath();
      ctx.roundRect(rx, 140, rw, 175, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText('Supplier Status Legend & Counts', rx + 18, 168);

      const items = [
        { label: 'Healthy (≥90% on-time fulfillment)', count: okCount, col: '#10b981' },
        { label: 'Need attention (80%–89% on-time)', count: warnCount, col: '#f59e0b' },
        { label: 'At risk (<80% on-time delivery)', count: badCount, col: '#ef4444' }
      ];

      items.forEach((it, idx) => {
        const iy = 202 + idx * 36;
        ctx.fillStyle = it.col;
        ctx.beginPath();
        ctx.roundRect(rx + 20, iy - 11, 14, 14, 3);

        ctx.fillStyle = '#1e293b';
        ctx.font = '13.5px sans-serif';

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText(`${it.count} Suppliers`, rx + rw - 115, iy);
      });

      // Box 2: Key Metric
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.roundRect(rx, 330, rw, 130, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#64748b';
      ctx.font = '12px sans-serif';
      ctx.fillText('Average On-Time Delivery Rate', rx + 18, 358);
      ctx.fillStyle = '#10b981';
      ctx.font = 'bold 32px sans-serif';
      ctx.fillText(`${total ? avg + '%' : '0%'}`, rx + 18, 396);

      // Box 3: Descriptions

      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('Status Breakdown & Guidance', rx + 18, 502);

      ctx.fillStyle = '#475569';
      ctx.font = '12.5px sans-serif';
      ctx.fillText('• Healthy: Suppliers fulfill orders reliably with ≥90% punctuality.', rx + 18, 530);
      ctx.fillText('• Need attention: Shipment delays observed; buffer stock suggested.', rx + 18, 554);
      ctx.fillText(`• Active suppliers: ${sups.slice(0, 4).join(', ')}${sups.length > 4 ? '...' : ''}`, rx + 18, 578);

    } else if (id === 'dn') {
      const c = S.cnt;

      const val = R(invVal());

        const iy = 200 + idx * 33;
        ctx.fillStyle = it.col;
        ctx.beginPath();
        ctx.roundRect(rx + 20, iy - 11, 14, 14, 3);

        ctx.fillStyle = '#0f172a';

        ctx.fillText(`${it.count} Items`, rx + rw - 100, iy);

      ctx.beginPath();
      ctx.roundRect(rx, 375, rw, 110, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#64748b';
      ctx.font = '12px sans-serif';
      ctx.fillText('Total Inventory Capital Valuation', rx + 18, 403);
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 28px sans-serif';
      ctx.fillText(val, rx + 18, 439);
      ctx.fillStyle = '#64748b';
      ctx.font = '13px sans-serif';
      ctx.fillText(`Across ${total} total active products in warehouse.`, rx + 18, 467);

      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.roundRect(rx, 500, rw, 120, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('Operational Guidelines', rx + 18, 527);
      ctx.fillStyle = '#475569';

        ctx.font = '13px sans-serif';
        ctx.fillText(it.label, rx + 20, iy);

        ctx.fillStyle = it.col;

        ctx.fillText(it.val, rx + rw - 180, iy);

      ctx.font = '12px sans-serif';

        ctx.font = 'bold 15px sans-serif';
        ctx.fillText(m.val, rx + rw - 130, iy);
      });

      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.roundRect(rx, 340, rw, 150, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('Trading Legend & Metrics', rx + 18, 370);
      ctx.fillStyle = '#475569';
      ctx.font = '12.5px sans-serif';

    ctx.stroke();

    ctx.fillStyle = '#94a3b8';
    ctx.font = '12px sans-serif';
    ctx.fillText('SupplyIQ — AI-Powered Inventory & Supply Chain Intelligence Platform', 40, 715);
    ctx.fillText('Confidential · Internal Store Report', W - 260, 715);

    // 6. Download Trigger
    const url = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = `${title.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-report-supplyiq.png`;
    a.click();
    toast('Detailed report image downloaded successfully');
  };
  chartImg.src = mChart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' });
}

async function loadInventory() {
  try {
    const items = await inventory.get();
    S.prod = {};
    items.forEach(i => {
        const band = (i.forecast_low != null && i.forecast_high != null)
          ? [Math.round(Number(i.forecast_low)), Math.round(Number(i.forecast_high))] : [0, 0];
        S.prod[i.name] = {
          st:  Math.round(Number(i.quantity) || 0),
          dem: Math.round(Number(i.monthly_demand_est || i.monthly_demand || 100)),
          fd:  band,
          ok:  !!i.forecast_sufficient && i.forecast_low != null,
          basis: i.forecast_basis || null,
          obs: i.forecast_observed_days || 0,
          mid: i.forecast_level != null ? Math.round(Number(i.forecast_level)) : null,
          note: i.forecast_note || null,
          pr:  Number(i.unit_cost) || 100,
          sz:  i.pack_size || i.size || '',
          sku: i.sku,
          cat: i.category || '',
          sup:  i.supplier || '',
          status: i.status,
        };
    });

    // The donut, the KPI chips and the risk alerts all read from S.cnt, so the
    // buckets are derived from the same backend status the rest of the page
    // uses. computeStatus() only ever emits Critical / Low / Overstock / OK,
    // which is why 'Low' has to be filed under the "Low Stock" label here.
    S.cnt = { Healthy: 0, 'Low Stock': 0, Critical: 0, Overstock: 0, 'Slow Moving': 0 };
    for (const i of items) {
      if (i.status === 'Critical')        S.cnt.Critical++;
      else if (i.status === 'Low')        S.cnt['Low Stock']++;
      else if (i.status === 'Overstock')  S.cnt.Overstock++;
      else if (i.status === 'Slow Moving') S.cnt['Slow Moving']++;
      else                                S.cnt.Healthy++;
    }
    return items;
  } catch { return null; }
}

      ? '<datalist id="'+id+'">'+items.map(v=>'<option value="'+esc(v)+'"></option>').join('')+'</datalist>' : '';
    const field = (id, label, input) =>
      '<div class="fld"><label class="mut" for="'+id+'">'+label+'</label>'+input+'</div>';
    modal(
      '<div class="h"><h3>Stock Out</h3><a data-close="1">Close</a></div>'
      + '<p class="mut" style="margin:-2px 0 12px;font-size:12px">Record items leaving your inventory</p>'
      + '<div class="fl">'
      + field('sop', 'Product *', '<input class="f" id="sop" list="sol" autocomplete="off" placeholder="Select/Search Product">'+dlist('sol',prodNames))
      + field('sod', 'Date *', '<input class="f" id="sod" type="date">')
      + field('soq', 'Quantity *', '<input class="f" id="soq" type="number" min="0" step="any" placeholder="0" inputmode="decimal">')
      + field('sor', 'Reason', '<select class="f" id="sor"><option value="sale">Sale</option><option value="damage">Damage</option><option value="expiry">Expired</option><option value="lost">Lost</option><option value="adjustment">Other</option></select>')
      + field('soi', 'Invoice No.', '<input class="f" id="soi" placeholder="Optional" autocomplete="off">')
      + '</div>'
      + '<button class="btn w" id="soGo" style="margin-top:4px">Stock Out</button>'
    );
    const collect=()=>{
      const num=id=>{const v=$('#'+id).value.trim();return v===''?undefined:Number(v)};
      const txt=id=>{const v=$('#'+id).value.trim();return v===''?undefined:v};
      return { name:txt('sop'), quantity:num('soq'), reason:txt('sor'), date:txt('sod'), invoiceNo:txt('soi') };
    };
    // The product box is a name picker, but POST /api/stock/out is keyed on sku
    // (stock.findBySku), so the name has to be resolved to the catalogue record
    // before anything is posted. Sending the name straight through looks right
    // and fails with a 404 for every product whose name differs from its sku.
    // Matched case-insensitively and trimmed, because this is a typed box.
    const resolve=(name)=>{
      const key=Object.keys(S.prod).find(n=>n.trim().toLowerCase()===String(name||'').trim().toLowerCase());
      return key ? S.prod[key] : null;
    };
    const validate=(f)=>{
      if(!f.name) return 'Select a product.';
      if(!f.date) return 'Pick a date.';
      if(!(Number(f.quantity) > 0)) return 'Enter a quantity greater than zero.';
      const item=resolve(f.name);
      if(!item) return 'That product is not in your inventory.';
      if(!item.sku) return 'That product has no SKU, so stock cannot be recorded against it.';
      if(Number(f.quantity) > Number(item.st)) return 'Insufficient stock. Available quantity: '+Number(item.st);
      return null;
    };
    $('#soGo').onclick=async()=>{
      const btn=$('#soGo');
      const f=collect();
      const problem=validate(f);
      if(problem){ toast(problem,1); return; }
      const item=resolve(f.name);
      btn.disabled=true; btn.textContent='Saving...';
      try {
        const res = await stock.outRecord(item.sku, f.quantity, f.reason, f.date, f.invoiceNo);
        toast('Stock out recorded: '+f.quantity+' x '+f.name+'. '+res.newQuantity+' left.');
        closeM();
        S.stockOuts = S.stockOuts || [];
        S.stockOuts.unshift({ n: `${f.quantity} × ${f.name} (${f.reason || 'sale'})`, t: 'Just now' });
        await loadInventory();
        refreshStock();
        renderInv();
        renderStockOut();
        if (typeof renderStockOutHistory==='function') renderStockOutHistory();
      } catch (err) {
        const msg = String(err.message);
        if (msg.includes('Not enough stock') || msg.includes('Insufficient')) toast(msg, 1);
        else toast('Stock out failed: ' + msg, 1);
      } finally { btn.disabled=false; btn.textContent='Stock Out'; }
    };
  };
}

async function loadSalesChart(period) {
  try {
    const data = await sales.get(period);
    if (!data || !data.length) return false;
    if (period === '1D' && data.length === 1) {
      const totS = Number(data[0].sales) || 0;
      const totP = Number(data[0].profit) || 0;
      D['1D'].l = ['9 AM','12 PM','3 PM','6 PM','9 PM'];
      D['1D'].s = [Math.round(totS*0.1), Math.round(totS*0.25), Math.round(totS*0.35), Math.round(totS*0.2), Math.round(totS*0.1)];
      D['1D'].p = [Math.round(totP*0.1), Math.round(totP*0.25), Math.round(totP*0.35), Math.round(totP*0.2), Math.round(totP*0.1)];
      D['1D'].sold = Math.round(Number(data[0].units_sold) || 0);
    } else {
      const labels   = data.map(d => new Date(d.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }));
      D[period].l    = labels;
      D[period].s    = data.map(d => Number(d.sales) || 0);
      D[period].p    = data.map(d => Number(d.profit) || 0);
      D[period].sold = Math.round(data.reduce((s, d) => s + (Number(d.units_sold) || 0), 0));
    }
    const k = window._lastKpi;
    D[period].out  = Math.round(Number(k?.runningOut ?? Object.entries(S.prod).filter(([,p])=>p.status==='Critical').length) || 0);
    D[period].rec  = Math.round(Number(k?.stockReceived ?? 0) || 0);
    D[period].dl   = D[period].dl || [8, 12, 6, -2, 10];
    return true;
  } catch { return false; }
}

async function loadOrders() {
  try {
    const ords = await orders.list();
    S.inc = ords.map(o => ({ p: o.product, q: o.quantity, s: o.supplier, st: o.status, no: o.order_no }));
    return ords;
  } catch { return null; }
}

async function apiStockIn(sku, qty, note, unitCost, reason) {
  // unitCost and reason are forwarded rather than dropped: the cost decides what
  // the movement is valued at, and the backend defaults a missing reason to
  // "adjustment" so callers that only pass three arguments still behave.
  return stock.in(sku, qty, note, unitCost, reason);
}
async function apiStockOut(sku, qty, note) {
  return stock.out(sku, qty, note);
}
async function apiPlaceOrder(supplier, sku, product, qty, unitCost) {
  return orders.create(supplier, sku, product, qty, qty * (unitCost || 0));
}
async function apiReceiveOrder(order_no) {
  return orders.receive(order_no);
}

async function apiChat(message) {
  try {
    const r = await chat.send(message);
    DB_ONLINE = true;
    // Return full object {reply, actions} so ask() can use both
    return { reply: r.reply || '', actions: r.actions || [] };
  } catch { DB_ONLINE = false; return null; }
}

function openAddStockModal(){
    const supNames = (STORE_PROFILE?.suppliers||[]).map(s=>s.name).filter(Boolean);
    const prodNames = Object.keys(S.prod);
    const dlist = (id, items) => items.length
      ? `<datalist id="${id}">${items.map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist>` : '';
    const field = (id, label, input) =>
      `<div class="fld"><label class="mut" for="${id}">${label}</label>${input}</div>`;
    modal(`<div class="h"><h3>Add Stock</h3><a data-close="1">Close</a></div>
      <p class="mut" style="margin:-2px 0 12px;font-size:12px">Receive new stock into inventory</p>
      <div class="fl">
        ${field('ap',  'Product *',               `<input class="f" id="ap"  list="pl" autocomplete="off" placeholder="Select/Search Product">${dlist('pl',prodNames)}`)}
        ${field('asup','Supplier *',             `<input class="f" id="asup" list="sl" autocomplete="off" placeholder="Select/Search Supplier">${dlist('sl',supNames)}`)}
        ${field('adate','Date *',                `<input class="f" id="adate" type="date">`)}
        ${field('aq',  'Quantity *',             `<input class="f" id="aq"  type="number" min="0" step="any" placeholder="0" inputmode="decimal">`)}
        ${field('auc', 'Purchase Price / Unit *',`<input class="f" id="auc" type="number" min="0" step="any" placeholder="₹0.00" inputmode="decimal">`)}
        ${field('asp', 'Selling Price / Unit *', `<input class="f" id="asp" type="number" min="0" step="any" placeholder="₹0.00" inputmode="decimal">`)}
        ${field('ainv','Invoice No.',            `<input class="f" id="ainv" placeholder="Optional" autocomplete="off">`)}
      </div>
      <button class="btn w" id="addGo" style="margin-top:4px">Add Stock</button>
      <p class="mut" style="font-size:11.5px;margin:8px 0 0">A product that is not in your catalogue yet is created automatically and saved to this store.</p>`);

    const collect=()=>{
      const num=id=>{const v=$('#'+id).value.trim();return v===''?undefined:Number(v)};
      const txt=id=>{const v=$('#'+id).value.trim();return v===''?undefined:v};
      return { name:txt('ap'), supplier:txt('asup'), quantity:num('aq'), unitCost:num('auc'), sellPrice:num('asp'), date:txt('adate'), invoiceNo:txt('ainv') };
    };
    const validate=(f)=>{
      if(!f.name) return 'Select a product.';
      if(!f.supplier) return 'Select a supplier.';
      if(!f.date) return 'Pick a date.';
      if(!(Number(f.quantity) > 0)) return 'Enter a quantity greater than zero.';
      if(f.unitCost === undefined) return 'Enter the purchase price.';
      if(f.sellPrice === undefined) return 'Enter the selling price.';
      return null;
    };
    $('#addGo').onclick=async()=>{
      const btn=$('#addGo');
      const f=collect();
      const problem=validate(f);
      if(problem){ toast(problem,1); return; }
      btn.disabled=true; btn.textContent='Saving…';
      const ok=await addStock(f, false);
      if(ok) closeM();
      else { btn.disabled=false; btn.textContent='Add Stock'; }
    };
  }

function reorder(p,q){
  closeM();q=+q||100;
  const prod=S.prod[p];
  const sup=prod?.sup || STORE_PROFILE?.suppliers?.[0];
  if(!sup){ toast('No supplier available for this product', 1); return; }
  const sku=prod?.sku||'';
  if(DB_ONLINE&&sku){apiPlaceOrder(sup,sku,p,q,prod?.pr).then(()=>loadOrders()).catch(()=>{})}
  else{S.inc.unshift({p,q,s:sup,st:'Ordered'})}
  renderFc();toast(`Purchase order placed: ${q} × ${p}`)}
function placeAll(list){
  const sup=STORE_PROFILE?.suppliers?.[0];
  if(!sup){ toast('No suppliers available for bulk order', 1); return; }
  list.forEach(o=>{
    const prod=S.prod[o[0]];const sku=prod?.sku||'';
    if(DB_ONLINE&&sku)apiPlaceOrder(sup,sku,o[0],o[1],prod?.pr).catch(()=>{});
    else S.inc.unshift({p:o[0],q:o[1],s:sup,st:'Ordered'});
  });closeM();renderFc();toast(list.length+' purchase orders placed')}
function openKpiModal(idx){

  const crit = Object.entries(S.prod).filter(([, p]) => p.status === 'Critical' || p.status === 'Low');
  const periodLabel = ({ '1D': 'Today, hourly', '1W': 'This week, daily', '15D': 'Last 15 days', '1M': 'This month, weekly' })[S.per] || 'Current Period';
  const trend = (d.dl && d.dl[idx] !== undefined) ? d.dl[idx] : 0;
  const vsLabel = lab[S.per] || 'previous period';

  if (idx === 0) { // Sales
    modal(`
      <div class="h"><span class="ic">${ic('rupee')}</span><h3>Sales Summary</h3><a data-close="1">Close</a></div>

      <div style="font-size:32px;font-weight:800;color:var(--acc);margin:8px 0 2px">${R(pf)}</div>

      <div class="h"><span class="ic">${ic('bag')}</span><h3>Products Sold</h3><a data-close="1">Close</a></div>
      <div style="font-size:32px;font-weight:800;color:var(--ink);margin:8px 0 2px">${totalSold} units</div>
      <span class="mut" style="font-size:12px">${periodLabel} · ${trend}% vs ${vsLabel}</span>
      <div style="margin-top:14px;border-top:1px solid var(--bd);padding-top:10px">
        <div class="rw">Total Units Sold<b>${totalSold}</b></div>
        <div class="rw">Average Selling Price<b>${avgPrice}</b></div>
        <div class="rw">Active Products in Inventory<b>${Object.keys(S.prod).length}</b></div>
      </div>
      <button class="btn w" style="margin-top:12px" onclick="document.querySelector('[data-v=best]')?.click()">View Top Selling Products</button>

  } else if (idx === 3) { // Running Out of Stock

document.addEventListener('click', e => {
  if (e.target.closest('#modc')) return;

  const a = e.target.closest('[data-act]');
  if (a) {
    const d = a.dataset;
    if (d.act == 'reorder') reorder(d.p, d.q);
    if (d.act == 'placeall') placeAll(JSON.parse(d.list));
    if (d.act == 'clear') { S.slowVal = Math.round(S.slowVal * .5); closeM(); renderAtt(); toast('20% clearance offer activated'); }
    if (d.act == 'msg') { closeM(); toast(d.m); }
    return;
  }

  const r = e.target.closest('tr.pr,.pc');
  if (r) { openProd(r.dataset.p); return; }

  const f = e.target.closest('tr.fr');
  if (f && !e.target.closest('button')) {
    S.sel = f.dataset.p; S.fcHist = null; renderFc(); loadFcHistory(); return;
  }

  const v = e.target.dataset.v;
  if (v) {
    if (v === 'suppliers') {
      const sups = STORE_PROFILE?.suppliers || [];
      modal(`<div class="h"><h3>All Suppliers</h3><a data-close="1">Close</a></div>` + (sups.length ? sups.map(s => `<div class="rw hv">${ic('users')}${s}<b>Active</b></div>`).join('') : '<p class="mut" style="padding:14px">No suppliers recorded yet.</p>'));
    } else if (v === 'best') {
      const prods = Object.entries(S.prod).sort((a,b)=>b[1].dem-a[1].dem);
      modal(`<div class="h"><h3>Best Selling Products</h3><a data-close="1">Close</a></div>` + (prods.length ? prods.map(([n, p]) => `<div class="rw hv">${pimg(n, 44)}<div><b>${n}</b><br><small class="mut">Demand: ${p.dem}/mo · Price: ${R(p.pr)}</small></div><b>${p.st} in stock</b></div>`).join('') : '<p class="mut" style="padding:14px">No products or sales recorded yet.</p>'));
    } else if (v === 'risks') {
      modal(`<div class="h"><h3>Risk &amp; Alerts</h3><a data-close="1">Close</a></div><p class="mut" style="margin-bottom:12px">Current risk posture and operational recommendations for your store.</p><div class="rw">Stockout risks<b>${Object.entries(S.prod).filter(([,p])=>p.status==='Critical').length} products</b></div><div class="rw">Overstock items<b>${Object.entries(S.prod).filter(([,p])=>p.status==='Overstock').length} products</b></div><div class="rw">Suppliers active<b>${(STORE_PROFILE?.suppliers||[]).length}</b></div>`);
    } else {
      const rows = Object.entries(S.prod);
      modal(`<div class="h"><h3>All ${v}</h3><a data-close="1">Close</a></div>` + (rows.length ? rows.map(([n, p]) => `<div class="rw hv">${pimg(n, 44)}${n}<b>${p.st} in stock</b></div>`).join('') : '<p class="mut" style="padding:14px">No items recorded yet.</p>'));
    }
    return;
  }

  // Allow native interactive clicks inside cards
  if (e.target.closest('button, input, select, textarea, label, [data-close], [data-fp], [data-gf]')) {
    return;
  }

  // 1. KPI cards click
  const kpiCard = e.target.closest('.card.kpi');
  if (kpiCard) {
    const allKpis = [...document.querySelectorAll('#kpis .kpi')];
    const idx = allKpis.indexOf(kpiCard);
    if (idx !== -1) { openKpiModal(idx); return; }
  }

  // 2. Attention cards click
  const attCard = e.target.closest('.att');
  if (attCard) {
    const btn = attCard.querySelector('button');
    if (btn) { btn.click(); return; }
  }

  // 3. Sales & Profit chart card click
  const sc = e.target.closest('#chartc');
  if (sc) {
    maximizeChart('cvs', 'Sales & Profit');
    return;
  }

  // 4. Inventory Overview card click
  const invCard = e.target.closest('#inv');
  if (invCard) {
    maximizeChart('dn', 'Inventory Overview');
    return;
  }

  // 5. Supplier Overview card click
  const supCard = e.target.closest('#sup');
  if (supCard) {
    maximizeChart('rg', 'Supplier Overview');
    return;
  }

  // 6. Demand Forecast card click
  const fcCard = e.target.closest('#forecast');
  if (fcCard && !e.target.closest('table')) {
    maximizeChart('fch', 'Demand Forecast');
    return;
  }

  // 7. Best Selling Products card click
  const bestCard = e.target.closest('#best');
  if (bestCard) {
    document.querySelector('[data-v="best"]')?.click();
    return;
  }

  // 8. Risks card click
  const rc = e.target.closest('#risks');
  if (rc) {
    const btn = rc.querySelector('button');
    if (btn) btn.click();
    else document.querySelector('[data-v="risks"]')?.click();
    return;
  }
});

async function handleFileUpload(f){
  if(!f) return;
  if(!/\.csv$/i.test(f.name)){
    toast(`${f.name}: Please export as CSV`, 1);
    return;
  }
  const r=new FileReader();
  r.onerror=()=>toast('Could not read file',1);
  r.onload=()=>{
    const text = r.result;
    // The import type is decided by the backend from the column headers, not
    // chosen here. Naming it in this handler is what let a full transaction
    // ledger be committed as a stock-level file: `stock_levels` only needs
    // sku,quantity, which a ledger also has, so it validated cleanly and then
    // wrote every row as an opening balance.
    // A file the backend cannot place is refused there with an explanation,
    // which is surfaced here rather than swallowed by a generic toast.
    imports.validate('auto', f.name, text)
      .then(async job => {
        showImportTypeBanner(job.type);
        if(job.errorCount > 0 || job.valid > 0){
          // Validation only returns summary; fetch full job with preview data
          try {
            const fullJob = await imports.get(job.id);
            showImportPreview(fullJob, text);
          } catch(err) {
            console.warn('Could not fetch import preview:', err);
            showImportPreview(job, text);
          }
        } else {
          toast('No valid rows in file', 1);
        }
      })
      .catch(err => {
        // 400 = the columns are not a format we know; 409 = this exact file has
        // already been imported; 413 = the file exceeded the upload limit. All
        // three need the message shown, not just a red toast.
        if(err.status===400 || err.status===409 || err.status===413 || err.code==='unmodified_template' || err.code==='duplicate_file' || err.code==='empty_file'){
          showImportFormatError(err.message, err.status, err.code);
        } else {
          toast('Validation failed: ' + err.message, 1);
        }
      });
  };
  r.readAsText(f);
  $('#fi').value='';
}

// Confirm out loud which format was detected. A silent guess is indistinguishable
// from a correct one until the numbers are wrong, so the chosen type is always
// stated before the preview.
let _impTypeNote=null;
function showImportTypeBanner(type){
  const el=$('#impTypeNote');
  if(!el) return;
  if(!type){ el.innerHTML=''; el.classList.add('hide'); _impTypeNote=null; return; }
  const label=(window.IMPORT_LABELS&&window.IMPORT_LABELS[type])||type;
  const txt=`Detected format: <b>${label}</b>`;
  if(_impTypeNote!==txt){ el.innerHTML=txt; el.classList.remove('hide'); _impTypeNote=txt; }
}

// A column/format/size problem is not a transient toast: it needs the reason and
// a route to the guide, because retrying the same file will never work. The
// text comes from the server, so it is escaped rather than injected as HTML.
const IMPORT_ERROR_TITLES = {
  400: "This file's format wasn't recognised",
  409: 'Duplicate File Upload Blocked',
  413: 'This file is too large to upload',
};
function showImportFormatError(message, status, code){
  const el=$('#impErr');
  if(!el) return;
  let title = IMPORT_ERROR_TITLES[status] || 'This file could not be imported';
  const msgLower = String(message || '').toLowerCase();
  if (code === 'unmodified_template' || msgLower.includes('template')) {
    title = 'Sample Template Detected (Unmodified)';
  } else if (code === 'duplicate_file' || msgLower.includes('duplicate') || status === 409) {
    title = 'Duplicate File Upload Blocked';
  } else if (code === 'empty_file' || msgLower.includes('khali') || msgLower.includes('empty')) {
    title = 'Empty File Detected';
  }
  el.innerHTML=`<div class="ie">
    <div class="ie-t">${esc(title)}</div>
    <div class="ie-m">${esc(String(message || 'No further detail was given.'))}</div>
    <div class="ie-a"><button class="btn sm" onclick="$('#impErr').classList.add('hide')">Dismiss</button>
      <button class="btn sm oc" onclick="showCsvGuide()">CSV format guide</button></div>
  </div>`;
  el.classList.remove('hide');
}

function showImportPreview(job, csvText){
  // Validation returns a summary ({ total, valid, errorCount, warningCount });
  // GET /api/imports/:id returns the full job ({ total_rows, valid_rows,
  // error_rows, errors, can_commit }). Both reach this function, so the two shapes
  // are normalised here first.
  //
  // Reading one shape while being handed the other is what made CSV upload look
  // broken: `job.valid` was undefined on the detail response, so
  // `job.valid > 0` was false and the Import button was never rendered at all —
  // the preview opened with "undefined valid" and no way to commit.
  const num = (...vals) => { for (const v of vals) if (v !== undefined && v !== null) return Number(v) || 0; return 0; };
  const errors     = Array.isArray(job.errors) ? job.errors : [];
  const detail     = job.preview || { rows: [], warnings: [] };
  const total      = num(job.total_rows, job.total);
  const valid      = num(job.valid_rows, job.valid);
  const errorCount = num(job.errorCount, errors.length, job.error_rows);
  const warningCount = num(job.warningCount, detail.warnings.length);
  const canCommit  = job.can_commit !== undefined ? !!job.can_commit : valid > 0;
  const html = `
    <div class="h"><h3>Import Preview</h3><a data-close="1">Close</a></div>
    <div class="mut" style="margin-bottom:8px">
      ${total} row(s) in file · ${valid} valid · ${errorCount} error(s) · ${warningCount} warning(s)
    </div>
    ${errorCount ? `<div style="margin-bottom:8px;padding:8px;background:var(--soft);border-radius:8px">
      <b>${errorCount} row(s) will be skipped:</b>
      <ul style="margin:4px 0 0 18px;max-height:120px;overflow:auto">${errors.map(e =>
        `<li>Line ${e.row_no}${e.column_name ? ' · ' + esc(e.column_name) : ''}${e.raw_value !== null && e.raw_value !== undefined && e.raw_value !== '' ? ' · value "' + esc(String(e.raw_value)) + '"' : ''} — ${esc(e.error_message || e.error_code || '')}</li>`).join('')}</ul>
    </div>` : ''}
    ${detail.warnings.length ? `
      <div style="margin-bottom:8px;padding:8px;background:var(--soft);border-radius:8px">
        <b>Warnings:</b>
        <ul style="margin:4px 0 0 18px">${detail.warnings.map(w => `<li>Line ${w.row_no}: ${esc(w.error_message || '')}</li>`).join('')}</ul>
      </div>` : ''}
    ${detail.rows.length ? `

// Adds stock by hand from the "Add Stock" button.
//
// This used to be the reason stock "did not add": a name typed into the box that
// was not already in the catalogue was pushed into S.prod as a local-only row
// with an empty SKU, and the API call below was guarded on a SKU being present.
// The guard failed, no request was ever sent, and a success toast still fired —
// so the quantity lived in the tab and disappeared on refresh.
//
// Now a name that is not in the catalogue is created on the server first
// (products.create), and the quantity is part of that same call. The saved
// values are then re-read from the database rather than trusted from local
// state, so what the screen shows is what was actually written.
async function addStock(fields, quiet) {
  // Takes the whole form as an object rather than a name and a quantity, because
  // the products endpoint stores all of these and any field the form collects but
  // drops here is a field the shopkeeper silently typed for nothing.
  const f = Object.assign({}, fields || {});
  const n = String(f.name == null ? '' : f.name).trim();
  const q = Number(f.quantity);
  f.name = n;
  if (!n || !(q > 0)) { toast('Enter a valid product and quantity', 1); return false; }

  const existing = Object.keys(S.prod).find(x => x.toLowerCase() === n.toLowerCase());

  if (DB_ONLINE && !existing) {
    try {
      // The create call carries the opening quantity and every master field, so a
      // product added here is indistinguishable from one that arrived by import.
      const made = await products.create(Object.assign({}, f, { quantity: q }));
      toast(`Added ${q} units of ${made.name || n} (SKU ${made.sku})`);
      await loadInventory();
      await loadKpis();
      refreshStock();
      renderPeriod();
      return true;
    } catch (err) {
      // A 409 means the product is already there under this name, so fall
      // through and add the quantity to it instead of failing the whole entry.
      if (err.status !== 409) {
        toast('Could not save: ' + (err.message || 'unknown error'), 1);
        return false;
      }
    }
  }

  const k = existing || n;
  if (!S.prod[k]) { S.prod[k] = { st: 0, dem: 0, fd: [0, 0], pr: 0, sku: '', sup: '' }; S.cnt.Healthy++; }
  const was = S.prod[k].st; S.prod[k].st += q;
  if (was < 20 && S.prod[k].st >= 20 && S.cnt['Low Stock'] > 0) { S.cnt['Low Stock']--; S.cnt.Healthy++; }
  S.extraVal += q * S.prod[k].pr;

  if (DB_ONLINE && S.prod[k].sku) {
    try {
      // The movement carries the cost that was typed in, so stock is valued at
      // what it actually cost rather than at the stale local price.
      await apiStockIn(S.prod[k].sku, q, 'Manual add', f.unitCost);
      await loadInventory();
      await loadKpis();
    } catch (err) {
      // The server rejected the movement, so the optimistic local bump above is
      // rolled back rather than left showing stock that was never received.
      S.prod[k].st = was;
      S.extraVal -= q * S.prod[k].pr;
      if (was < 20 && S.prod[k].st + q >= 20 && S.cnt['Low Stock'] > 0) { S.cnt['Low Stock']++; S.cnt.Healthy--; }
      toast('Could not add stock: ' + (err.message || 'unknown error'), 1);
      return false;
    }
  }

  if (!quiet) { refreshStock(); toast(`Added ${q} units of ${k}`); }
  return true;
}

const FC_DAYS=30;
async function loadFcHistory(){

// Series for the chart: real past days, then a flat projection of the observed
// mean across the horizon. The backend already returns the expected range, so
// the "AI" line here is only the midpoint walk — no new numbers are invented.
function fcSeries(n){
  const p=S.prod[n]||{};
  const hist=(S.fcHist&&S.fcHist.sku===p.sku)?S.fcHist:null;
  let actual=(hist&&Array.isArray(hist.points))?hist.points.map(x=>Number(x.sold)||0):[];
  let labels=(hist&&Array.isArray(hist.points))?hist.points.map((x,i)=>i===hist.points.length-1?'Today':String(x.date||'').slice(5)):[];

  // Fallback points so the chart is never an empty void even if history is fresh/zero
  if(!actual.length){
    const base=Math.max(1,Math.round((p.dem||60)/30));
    actual=[Math.max(0,base-1),base,Math.max(0,base-1),base+1,Math.max(0,base-1),base,base];
    labels=['D-6','D-5','D-4','D-3','D-2','Yesterday','Today'];
  }

  const N=actual.length;
  const mean=N?actual.reduce((s,v)=>s+v,0)/N:0;
  const enough=(hist?!!hist.sufficient:true)&&(p.ok||p.dem>0||actual.some(x=>x>0));
  const fwd=7;
  const midVal=Math.max(1,Math.round(p.mid||mean||4));
  const lowVal=(p.fd&&p.fd[0]!=null)?p.fd[0]:Math.max(0,midVal-2);
  const highVal=(p.fd&&p.fd[1]!=null)?p.fd[1]:(midVal+3);

  const lb=[...labels,...Array.from({length:fwd},(_,i)=>`+${i+1}d`)];
  const seriesA=[...actual,...Array(fwd).fill(null)];

  const lastActual=N>0?actual[N-1]:midVal;
  const padNull=Array(Math.max(0,N-1)).fill(null);

  const seriesF=enough
    ?[...padNull,lastActual,...Array(fwd).fill(midVal)]
    :Array(N+fwd).fill(null);

  const seriesLo=enough
    ?[...padNull,lastActual,...Array(fwd).fill(lowVal)]
    :Array(N+fwd).fill(null);

  const seriesConf=enough
    ?[...padNull,0,...Array(fwd).fill(Math.max(0,highVal-lowVal))]
    :Array(N+fwd).fill(null);

  return{a:seriesA,f:seriesF,lo:seriesLo,hi:seriesConf,lb,enough,mid:lastActual};
}

// Converts basic markdown (**bold**, bullets, line breaks, emoji→icon) to safe HTML
function mdToHtml(t){
  if(!t)return'';
  // SVG icon helper (inline, 15px, vertically aligned)
  const svgIcon=(path,col)=>`<span style="display:inline-flex;align-items:center;vertical-align:middle;width:16px;height:16px;margin-right:3px;flex:none;color:${col}"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg></span>`;
  // Emoji → icon map (applied before HTML escaping so emojis are still raw Unicode)
  const eMap={
    '⚠️':svgIcon('M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4M12 17h.01','#f59e0b'),
    '📦':svgIcon('M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z','var(--acc)'),
    '🏆':svgIcon('M8 21h8M12 21v-5M17 3H7l-1 9a5 5 0 0010 0L17 3zM4 9H2M22 9h-2','#f59e0b'),
    '💰':svgIcon('M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6','#22b573'),
    '🐌':svgIcon('M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4M12 17h.01','#f59e0b'),
    '🏭':svgIcon('M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75','#6366f1'),
    '🙏':svgIcon('M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z','var(--acc)'),
    '✅':svgIcon('M22 11.08V12a10 10 0 11-5.93-9.14M22 4L12 14.01l-3-3','#22b573'),
    '💡':svgIcon('M9 18h6M10 22h4M12 2a7 7 0 015 11.95V17a1 1 0 01-1 1H8a1 1 0 01-1-1v-3.05A7 7 0 0112 2z','#f59e0b'),
    '📊':svgIcon('M18 20V10M12 20V4M6 20v-6','var(--acc)'),
    '🛡️':svgIcon('M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z','#6366f1'),
    '🎉':svgIcon('M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z','#f59e0b'),
  };
  // Replace emojis first (before HTML escaping — emojis are not HTML-special chars)
  let s=String(t);
  for(const[e,h] of Object.entries(eMap)) s=s.split(e).join(h);
  // Escape remaining HTML special chars in plain text portions
  // Use a placeholder approach: already-inserted HTML spans must survive
  // Simple: split on our span tags, escape text nodes, rejoin
  const parts=s.split(/(<span[\s\S]*?<\/span>)/g);
  s=parts.map((p,i)=>i%2===0?p.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):p).join('');
  // **bold** — multiline aware
  s=s.replace(/\*\*([\s\S]+?)\*\*/g,'<b>$1</b>');
  // Numbered items: "1. text" at start of line
  s=s.replace(/^(\d+)\.\s(.+)$/gm,'<span style="display:flex;gap:6px;align-items:baseline;margin:2px 0"><span style="color:var(--acc);font-weight:700;flex:none;min-width:14px">$1.</span><span>$2</span></span>');
  // Bullet lines: • text
  s=s.replace(/^•\s(.+)$/gm,'<span style="display:flex;gap:6px;align-items:baseline;margin:2px 0"><span style="color:var(--acc);font-weight:700;flex:none">›</span><span>$1</span></span>');
  // Double newlines → spacing
  s=s.replace(/\n\n/g,'<div style="height:5px"></div>');
  // Single newlines
  s=s.replace(/\n/g,'<br>');
  return s;
}

function answer(q){
  q=q.toLowerCase();const d=D[S.per];
  const crits=Object.entries(S.prod).filter(([,p])=>p.status==='Critical');
  const overs=Object.entries(S.prod).filter(([,p])=>p.status==='Overstock');
  const topSell=Object.entries(S.prod).sort((a,b)=>b[1].dem-a[1].dem)[0];
  const sup0=STORE_PROFILE?.suppliers?.[0];
  const stName=STORE_PROFILE?.name||'your store';
  if(/run out|running|stockout|khatam|critical|low stock/.test(q)){
    if(!crits.length)return`✅ **No critical stockouts** right now for **${stName}**. ${low().length} products are in low territory.`;
    return`⚠️ **${crits.length} product(s) near stockout:**\n${crits.map(([n,p])=>`• **${n}**: ${p.st} units left`).join('\n')}\n\nReorder immediately to avoid disruption.`}
  if(/order|buy|purchase|reorder/.test(q)){
    const needs=Object.entries(S.prod).filter(([,p])=>['Critical','Low'].includes(p.status));
    if(!needs.length)return`✅ **All products** at **${stName}** are well stocked. No urgent orders needed right now.`;
    return`📦 **Tomorrow's Order Plan:**\n${needs.slice(0,4).map(([n,p])=>`• **${n}**: ${Math.max(30,p.dem-p.st)} units from ${p.sup||'supplier'}`).join('\n')}`}
  if(/sold|sell|best|top/.test(q)){
    if(!topSell)return'No sales data available yet.';
    return`🏆 **Top seller:** ${topSell[0]}\n• Monthly demand: **${topSell[1].dem}** units\n• Daily value: **${R(topSell[1].pr*topSell[1].dem/30)}**`}
  if(/profit|margin|revenue|sales/.test(q)){
    const s=sum(d.s),p=sum(d.p);
    return s?`💰 **${S.per} Financial Summary:**\n• Sales: **${R(s)}**\n• Profit: **${R(p)}**\n• Margin: **${(p/s*100).toFixed(1)}%**`:'No sales data loaded yet. Connect the backend for live figures.';}
  if(/slow|stuck|overstock/.test(q)){
    if(!overs.length)return'✅ **No overstocked items** currently.';
    return`⚠️ **Overstock Items:**\n${overs.map(([n,p])=>`• **${n}**: ${p.st} units — ${R(p.st*p.pr)} tied up`).join('\n')}\n\n💡 Consider a 20% clearance offer.`}
  if(/supplier|delay/.test(q)){
    if(sup0) return `🏭 **${sup0}** is your primary supplier.\nMonitor delivery performance via the Supplier Overview panel.`;
    return 'No supplier data yet. Import a ledger CSV with supplier information to enable monitoring.';}
  return`🙏 Namaste! I'm **TradeSaarthi** for **${stName}**.\n\nAsk me about:\n• Products running out of stock\n• What to order tomorrow\n• Best sellers & profit\n• Slow moving / overstock items\n• Supplier performance`}

function ask(q){
  if(!q.trim())return;
  say(q,'u');
  say('','typing'); // show animated dots
  if(DB_ONLINE){
    apiChat(q).then(r=>{
      // r is now {reply:string, actions:[]} — use reply text, fallback to local answer()
      const text = (r && r.reply) ? r.reply : answer(q);
      say(text,'b');
      // Update quick-reply chips with dynamic suggestions from backend
      if(r && r.actions && r.actions.length) setChips(r.actions);
    }).catch(()=>{say(answer(q),'b')});
  } else {
    setTimeout(()=>{say(answer(q),'b')},900);
  }
}
