# nginx config for the SupplyIQ static frontend.
#
# Mounted by docker-compose.yml. The goal is to serve the frontend/ directory
# with exactly the same URL layout that frontend/serve.js uses locally, because
# the pages address each other with real paths: the dashboard redirects to
# public/login.html, and public/login.html loads js/auth.js relative to itself.
# The previous compose file mounted public/login.html at the nginx root instead,
# so those redirects 404'd in Docker while working fine locally.

server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  public/landing.html;

    charset utf-8;
    server_tokens off;

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json;
    gzip_min_length   1024;

    # Single-page apps and auth pages must never be cached, otherwise a deploy
    # leaves browsers on an old bundle. Fingerprinted assets would be safe to
    # cache, but the project serves everything unversioned.
    location ~* \.html$ {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass         http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
